<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark Background -->
  <rect width="32" height="32" rx="6" fill="#0f0f0f" />
  
  <!-- Tech-style subtle grid -->
  <path d="M 0,8 L 32,8 M 0,16 L 32,16 M 0,24 L 32,24 M 8,0 L 8,32 M 16,0 L 16,32 M 24,0 L 24,32" stroke="#00d26a" stroke-opacity="0.06" stroke-width="0.5" />
  
  <!-- Glow Effect Filter -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Football / Neural network structure -->
  <!-- Outer ring connections -->
  <path d="M 16,5 L 26.5,12.6 L 22.5,25 L 9.5,25 L 5.5,12.6 Z" fill="none" stroke="#00d26a" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Outer Pentagon / Hexagonal structure lines -->
  <line x1="16" y1="5" x2="16" y2="10.5" stroke="#00d26a" stroke-width="1.2" filter="url(#glow)" />
  <line x1="26.5" y1="12.6" x2="20.8" y2="14.5" stroke="#00d26a" stroke-width="1.2" filter="url(#glow)" />
  <line x1="22.5" y1="25" x2="18.9" y2="20.1" stroke="#00d26a" stroke-width="1.2" filter="url(#glow)" />
  <line x1="9.5" y1="25" x2="13.1" y2="20.1" stroke="#00d26a" stroke-width="1.2" filter="url(#glow)" />
  <line x1="5.5" y1="12.6" x2="11.2" y2="14.5" stroke="#00d26a" stroke-width="1.2" filter="url(#glow)" />
  
  <!-- Inner Pentagon representing football center panel and core decision agent -->
  <polygon points="16,10.5 20.8,14.5 18.9,20.1 13.1,20.1 11.2,14.5" fill="none" stroke="#00d26a" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Central core AI node (RAG center) -->
  <circle cx="16" cy="16.3" r="2" fill="#ffffff" filter="url(#glow)" />
  <circle cx="16" cy="16.3" r="4" fill="#00d26a" fill-opacity="0.3" />
  
  <!-- Small connection lines from core to inner pentagon nodes -->
  <line x1="16" y1="16.3" x2="16" y2="10.5" stroke="#00d26a" stroke-width="0.8" stroke-dasharray="1 1" />
  <line x1="16" y1="16.3" x2="20.8" y2="14.5" stroke="#00d26a" stroke-width="0.8" stroke-dasharray="1 1" />
  <line x1="16" y1="16.3" x2="18.9" y2="20.1" stroke="#00d26a" stroke-width="0.8" stroke-dasharray="1 1" />
  <line x1="16" y1="16.3" x2="13.1" y2="20.1" stroke="#00d26a" stroke-width="0.8" stroke-dasharray="1 1" />
  <line x1="16" y1="16.3" x2="11.2" y2="14.5" stroke="#00d26a" stroke-width="0.8" stroke-dasharray="1 1" />

  <!-- Inner Nodes -->
  <circle cx="16" cy="10.5" r="1.2" fill="#00d26a" />
  <circle cx="20.8" cy="14.5" r="1.2" fill="#00d26a" />
  <circle cx="18.9" cy="20.1" r="1.2" fill="#00d26a" />
  <circle cx="13.1" cy="20.1" r="1.2" fill="#00d26a" />
  <circle cx="11.2" cy="14.5" r="1.2" fill="#00d26a" />
  
  <!-- Outer Nodes (larger neural network endpoints) -->
  <circle cx="16" cy="5" r="1.8" fill="#00d26a" />
  <circle cx="26.5" cy="12.6" r="1.8" fill="#00d26a" />
  <circle cx="22.5" cy="25" r="1.8" fill="#00d26a" />
  <circle cx="9.5" cy="25" r="1.8" fill="#00d26a" />
  <circle cx="5.5" cy="12.6" r="1.8" fill="#00d26a" />
</svg>
