<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Football RAG Multiagent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #000000;
      color: #00d26a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      line-height: 1.6;
      background-image:
        repeating-linear-gradient(0deg, rgba(0, 210, 106, 0.03) 0px, rgba(0, 210, 106, 0.03) 1px, transparent 1px, transparent 2px);
    }

    header {
      margin-bottom: 40px;
      border: 2px solid #00d26a;
      padding: 20px;
      background: rgba(0, 210, 106, 0.05);
      box-shadow: 0 0 20px rgba(0, 210, 106, 0.2);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00d26a, transparent);
      animation: scan 3s infinite;
    }

    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #00d26a;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 210, 106, 0.8);
    }

    header p {
      color: #00a852;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .prompt-prefix {
      color: #00d26a;
      font-weight: 700;
      white-space: nowrap;
    }

    .input-area {
      display: flex;
      gap: 0;
      border: 1px solid #00d26a;
      background: rgba(0, 210, 106, 0.02);
      box-shadow: inset 0 0 10px rgba(0, 210, 106, 0.1), 0 0 15px rgba(0, 210, 106, 0.15);
    }

    .input-area::before {
      content: '$ ';
      padding: 14px 12px;
      color: #00d26a;
      font-weight: 700;
      white-space: nowrap;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      background: transparent;
      border: none;
      color: #00d26a;
      font-size: 0.95rem;
      font-family: 'IBM Plex Mono', monospace;
      outline: none;
      caret-color: #00d26a;
    }

    input[type="text"]::placeholder {
      color: #005a3a;
    }

    input[type="text"]:focus {
      background: rgba(0, 210, 106, 0.03);
    }

    button {
      padding: 14px 20px;
      background: transparent;
      border: 1px solid #00d26a;
      border-left: none;
      color: #00d26a;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      transition: all 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    button:hover:not(:disabled) {
      background: rgba(0, 210, 106, 0.2);
      box-shadow: inset 0 0 10px rgba(0, 210, 106, 0.3), 0 0 20px rgba(0, 210, 106, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .examples {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0;
    }

    .examples-label {
      color: #00a852;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .examples-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      padding: 8px 14px;
      background: transparent;
      border: 1px solid #005a3a;
      color: #00a852;
      font-size: 0.8rem;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .chip:hover {
      border-color: #00d26a;
      color: #00d26a;
      box-shadow: 0 0 10px rgba(0, 210, 106, 0.4);
      background: rgba(0, 210, 106, 0.05);
    }

    .chip::before {
      content: '> ';
      margin-right: 4px;
    }

    .loading {
      display: none;
      flex-direction: column;
      gap: 10px;
      color: #00a852;
      font-size: 0.9rem;
      padding: 20px;
      border: 1px solid #005a3a;
      background: rgba(0, 210, 106, 0.02);
    }

    .loading.visible { display: flex; }

    .loading-bar {
      height: 2px;
      background: linear-gradient(90deg, #00d26a 0%, transparent 100%);
      animation: loading 1s infinite;
    }

    @keyframes loading {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }

    .loading-text::after {
      content: '';
      animation: typing 0.6s infinite;
    }

    @keyframes typing {
      0%, 10% { content: ''; }
      20% { content: '.'; }
      40% { content: '..'; }
      60% { content: '...'; }
    }

    .error {
      display: none;
      padding: 16px;
      border: 1px solid #ff3333;
      background: rgba(255, 51, 51, 0.05);
      color: #ff6b6b;
      font-size: 0.9rem;
      box-shadow: inset 0 0 10px rgba(255, 51, 51, 0.1);
    }

    .error.visible { display: block; }

    .error::before {
      content: '[ERROR] ';
      color: #ff3333;
      font-weight: 700;
      margin-right: 8px;
    }

    .response-box {
      display: none;
      border: 1px solid #00d26a;
      background: rgba(0, 210, 106, 0.02);
      box-shadow: inset 0 0 15px rgba(0, 210, 106, 0.1);
      overflow: hidden;
    }

    .response-box.visible { display: block; }

    .response-header {
      background: rgba(0, 210, 106, 0.1);
      border-bottom: 1px solid #00d26a;
      padding: 12px 16px;
      color: #00d26a;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .response-header::before {
      content: '[ ';
      margin-right: 8px;
    }

    .response-header::after {
      content: ' ]';
      margin-left: 8px;
    }

    .response-content {
      padding: 20px;
    }

    .question-text {
      font-size: 0.9rem;
      color: #00a852;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #005a3a;
      word-break: break-word;
    }

    .question-text::before {
      content: '$ ';
      margin-right: 6px;
      color: #00d26a;
    }

    .answer-text {
      font-size: 0.9rem;
      line-height: 1.8;
      color: #00d26a;
      white-space: pre-wrap;
      word-break: break-word;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #005a3a;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    footer::before {
      content: '--- ';
      margin-right: 8px;
    }

    footer::after {
      content: ' ---';
      margin-left: 8px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.1rem;
      }

      header p {
        font-size: 0.75rem;
      }

      .input-area {
        flex-direction: column;
      }

      .input-area::before {
        display: none;
      }

      button {
        border-left: 1px solid #00d26a;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>FOOTBALL-RAG [MULTIAGENT]</h1>
    <p>> Analysis of the 5 big European leagues with multi-agent AI</p>
  </header>

  <div class="container">

    <div class="input-area">
      <input
        type="text"
        id="question"
        placeholder="run a query..."
        onkeydown="if(event.key==='Enter') sendQuery()"
      />
      <button onclick="sendQuery()" id="btn">RUN</button>
    </div>

    <div class="examples">
      <div class="examples-label">Available commands:</div>
      <div class="examples-grid">
        <div class="chip" onclick="fillQuestion('How is Real Madrid performing this season?')">status real-madrid</div>
        <div class="chip" onclick="fillQuestion('What players does Arsenal have?')">players arsenal</div>
        <div class="chip" onclick="fillQuestion('How does Bayern Munich play tactically?')">tactic bayern</div>
        <div class="chip" onclick="fillQuestion('Compare PSG with Olympique de Marseille')">compare psg marseille</div>
        <div class="chip" onclick="fillQuestion('Which team leads the Bundesliga?')">leader bundesliga</div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="loading-text">$ agents analyzing query<span></span></div>
      <div class="loading-bar"></div>
    </div>

    <div class="error" id="error"></div>

    <div class="response-box" id="response">
      <div class="response-header">OUTPUT</div>
      <div class="response-content">
        <div class="question-text" id="question-display"></div>
        <div class="answer-text" id="answer-display"></div>
      </div>
    </div>

  </div>

  <footer>
    Football RAG Multiagent · LangGraph + FastAPI + Azure OpenAI
  </footer>

  <script>
    const API_URL = "https://football-multiagent-rag.onrender.com";

    function fillQuestion(text) {
      document.getElementById("question").value = text;
      document.getElementById("question").focus();
    }

    async function sendQuery() {
      const question = document.getElementById("question").value.trim();
      if (!question) return;

      const btn = document.getElementById("btn");
      const loading = document.getElementById("loading");
      const response = document.getElementById("response");
      const error = document.getElementById("error");

      response.classList.remove("visible");
      error.classList.remove("visible");
      loading.classList.add("visible");
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/query`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        if (!res.ok) throw new Error(`Error ${res.status}`);

        const data = await res.json();

        document.getElementById("question-display").textContent = data.question;
        document.getElementById("answer-display").textContent = data.answer;
        response.classList.add("visible");

      } catch (err) {
        error.textContent = `API connection failed. Verify server running at ${API_URL}`;
        error.classList.add("visible");
      } finally {
        loading.classList.remove("visible");
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
